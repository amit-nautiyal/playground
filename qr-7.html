<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />

    <style>
        .main-section {
            max-width: 500px; 
            margin: 0 auto

  </head>
  <body>
        <script src="html5-qrcode.min.js"></script>
    <div id="mainSection" class="my-4 mx-4 main-section">
      <div class="row mb-2">
        <div class="col">
            <label for="receipt_name" class="form-label fw-bold"
            >Part Number</label
          >
            <div class="input-group mb-3">
                <input id=""partNumber type="text" class="form-control" placeholder="Recipient's username" aria-label="Recipient's username" aria-describedby="button-addon2">
                <div class="input-group-append">
                  <button class="btn btn-outline-secondary" type="button" id="button-addon2" onclick="scanCode('partNumber')">Button</button>
                </div>
              </div>
        </div>
      </div>
      <div class="row mb-2">
        <div class="col">
          <label for="receipt_name" class="form-label fw-bold"
            >Bin</label
          >
          <div class="input-group mb-3">
            <input id="BinNumber" type="text" class="form-control" placeholder="Recipient's username" aria-label="Recipient's username" aria-describedby="button-addon2">
            <div class="input-group-append">
              <button class="btn btn-outline-secondary" type="button" id="button-addon2" onclick="scanCode('BinNumber')">Button</button>
            </div>
          </div>
      </div>
    </div>



    <div id="scannerSection">

        <div id="reader" width="300px"></div>
       <div id="show" style="display: none;">
           <h4>Scanned Result</h4>
           decodedText: <p style="color: blue;" id="result"></p>
       </div>
   </div>
   
    <script>
        function scanCode(action) {
            // alert(action);
            // $("#mainSection").hide();
            startQallQRReader(action);
        } 

        function startQallQRReader(action) {
            const html5Qrcode = new Html5Qrcode('reader');
            const qrCodeSuccessCallback = (decodedText, decodedResult)=>{
                if(decodedText){
                    document.getElementById('show').style.display = 'block';
                    document.getElementById('result').textContent = decodedText;
                    document.getElementById(action).val = decodedText;
                    
                    html5Qrcode.stop();
                }
            }
            const config = {fps:10, qrbox:{width:250, height:250}}
            html5Qrcode.start({facingMode:"environment"}, config,qrCodeSuccessCallback );
        }
