<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCANNER APP</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript">
     <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
        <style>
        .main-section {
            max-width: 500px; 
            margin: 0 auto
        }
    </style>
</head>
<body>
    <script src="./qrScript.js"></script>
    <div id="mainSection" class="my-4 mx-4 main-section">
      <div class="row mb-2">
        <div class="col">
            <label for="receipt_name" class="form-label fw-bold"
            >Part Number</label
          >
            <div class="input-group mb-3">
                <input id=""partNumber type="text" class="form-control" placeholder="Recipient's username" aria-label="Recipient's username" aria-describedby="button-addon2">
                <div class="input-group-append">
                  <button class="btn btn-outline-secondary" type="button" id="button-addon2" onclick="scanCode('partNumber')">Button</button>
                </div>
              </div>
        </div>
      </div>
      <div class="row mb-2">
        <div class="col">
          <label for="receipt_name" class="form-label fw-bold"
            >Bin</label
          >
          <div class="input-group mb-3">
            <input id="BinNumber" type="text" class="form-control" placeholder="Recipient's username" aria-label="Recipient's username" aria-describedby="button-addon2">
            <div class="input-group-append">
              <button class="btn btn-outline-secondary" type="button" id="button-addon2" onclick="scanCode('BinNumber')">Button</button>
            </div>
          </div>
      </div>
    </div>
    <div id="scannerSection" style="text-align: center;">

        <div id="reader" width="300px"></div>
       <div id="show" style="display: none;">
           <h4>Scanned Result</h4>
           decodedText: <p style="color: blue;" id="result"></p>
       </div>
   </div>
    <script>
        function scanCode(action) {
            // alert(action);
            $("#mainSection").hide();
            $("#scannerSection").show();
            function onScanSuccess(decodedText, decodedResult) {
                // Handle on success condition with the decoded text or result.
                console.log(`Scan result: ${decodedText}`, decodedResult);
                document.getElementById(action).textContent = decodedText;
                html5QrcodeScanner.clear();
            }

            var html5QrcodeScanner = new Html5QrcodeScanner("reader", {
                fps: 10,
                qrbox: 250,
            });
            html5QrcodeScanner.render(onScanSuccess);
        }
    </script>
    
</body>
</html>
