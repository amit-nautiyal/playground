<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <style>
        .main-section {
            max-width: 500px; 
            margin: 0 auto
        }
        
    </style>
  </head>
  <body>
    <script src="html5-qrcode.min.js"></script>
    <div id="mainSection" class="my-4 mx-4 main-section">
      <div class="row mb-2">
        <div class="col">
            <label for="receipt_name" class="form-label fw-bold"
            >Part Number</label
          >
            <div class="input-group mb-3">
                <input id="partNumber" type="text" class="form-control" placeholder="Part Number" />
                <div class="input-group-append">
                  <button class="btn btn-outline-secondary" type="button" id="button-addon2" onclick="scanCode('partNumber')">Button</button>
                </div>
              </div>
              <input id="partUUID" type="hidden" placeholder="Part UUID" />
        </div>
      </div>
      <div class="row mb-2">
        <div class="col">
          <label for="receipt_name" class="form-label fw-bold"
            >Bin</label
          >
          <div class="input-group mb-3">
            <input id="binNumber" type="text" class="form-control" placeholder="Bin Number" />
            <div class="input-group-append">
              <button class="btn btn-outline-secondary" type="button" id="button-addon2" onclick="scanCode('binNumber')">Button</button>
            </div>
          </div>
      </div>
    </div>
    <div id="scannerSection">
      <div id="reader" width="300px"></div>
      <div id="result"></div>
      </table>
   </div>
   
    <script>
        function scanCode(action) {
            startQallQRReader(action);
        } 
        function startQallQRReader(action) {
            const html5Qrcode = new Html5Qrcode('reader');
			
            async function qrCodeSuccessCallback(decodedText, decodedResult) {
                if(decodedText){
                    let data = Object.values(decodedResult);
                    console.log('data--', data);
                    let inputText = "";
                    let codeFormat = data[1].format.formatName;
                    
                    // check for "bin" in decodedText
                    const urlParams = new URLSearchParams(data[1].text);
                    const myParam = urlParams.get('bin');
                    if(myParam) {
                      console.log('bin----', myParam);
                      let replacedString = myParam.replace(/-/g, "");
                      console.log('replacedString----', replacedString.toUpperCase());
                      inputText = replacedString.toUpperCase();
                      document.getElementById('binNumber').value = inputText;
                    } else {
                      inputText = data[1].text;
                      let apiData = await getData(inputText, codeFormat);
                      let inputValue = apiData.manufacturer_name + " " + apiData.number + " " + apiData.name + " ";
                      document.getElementById('partNumber').value = inputValue;
                      document.getElementById('partUUID').value = apiData.part_uuid;
                    }
                    console.log('html5Qrcode--------', html5Qrcode);
                    html5Qrcode.stop();
                }
            }
            const config = {fps:10, qrbox:{width:250, height:250}}
            html5Qrcode.start({facingMode:"environment"}, config,qrCodeSuccessCallback );
        }

        async function getData(text, fomat) {
          const url = `https://manage.partxa.com/latest/system/barcode/get/?data=${text}&format_name=${fomat}`;
          try {
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`Response status: ${response.status}`);
            }

            const json = await response.json();
            console.log("data----------", json);
            if(json.result) {
                let data = json.data;
                return data;
            }
            
          } catch (error) {
            console.error(error.message);
          }
        } 
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
      integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </body>
</html>
