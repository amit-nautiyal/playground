<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <style>
        .main-section {
            max-width: 500px; 
            margin: 0 auto
        }
        
    </style>
  </head>
  <body>
    <script src="html5-qrcode.min.js"></script>
    <div id="mainSection" class="my-4 mx-4 main-section">
      <div class="row mb-2">
        <div class="col">
            <label for="receipt_name" class="form-label fw-bold"
            >Part Number</label
          >
            <div class="input-group mb-3">
                <input id="partNumber" type="text" class="form-control" placeholder="Part Number" />
                <div class="input-group-append">
                  <button class="btn btn-outline-secondary" type="button" id="button-addon2" onclick="scanCode('partNumber')">Button</button>
                </div>
              </div>
        </div>
      </div>
      <div class="row mb-2">
        <div class="col">
          <label for="receipt_name" class="form-label fw-bold"
            >Bin</label
          >
          <div class="input-group mb-3">
            <input id="BinNumber" type="text" class="form-control" placeholder="Bin Number" />
            <div class="input-group-append">
              <button class="btn btn-outline-secondary" type="button" id="button-addon2" onclick="scanCode('BinNumber')">Button</button>
            </div>
          </div>
      </div>
    </div>
    <div id="scannerSection">
      <div id="reader" width="300px"></div>
      <div id="show" style="display: none;">
          <h4>Scanned Result</h4>
          decodedText: <p style="color: blue;" id="result"></p>
      </div>
      <table class="table table-striped" id="myTable" style="display: none;">
        <tbody>
          <tr>
            <th>Format</th>
            <th>Text</th>
          </tr>
        </tbody>
      </table>
   </div>
   
    <script>
        function scanCode(action) {
            startQallQRReader(action);
        } 

        function startQallQRReader(action) {
            const html5Qrcode = new Html5Qrcode('reader');
			
            const qrCodeSuccessCallback = (decodedText, decodedResult)=>{
                if(decodedText){
                    console.log(`Message: ${decodedText}, Result: ${JSON.stringify(decodedResult)}`);
                    
                    document.getElementById('show').style.display = 'block';
                    document.getElementById('myTable').style.display = 'block';
                    let data = Object.values(decodedResult);
                    console.log('check--text--', data);
                    createTableRow(data);
					          document.getElementById("result").textContent = decodedText;
					          document.getElementById(action).value = decodedText;
                    html5Qrcode.stop();
					          document.getElementById('show').style.display = 'none';
                }
            }
            const config = {fps:10, qrbox:{width:250, height:250}}
            html5Qrcode.start({facingMode:"environment"}, config,qrCodeSuccessCallback );
        }

        function createTableRow(data) {
          // Find a <table> element with id="myTable":
          var table = document.getElementById("myTable");

          // Create an empty <tr> element and add it to the 1st position of the table:
          var row = table.insertRow(-1);

          // Insert new cells (<td> elements) at the 1st and 2nd position of the "new" <tr> element:
          var cell1 = row.insertCell(0);
          var cell2 = row.insertCell(1);

          // Add some text to the new cells:
          cell2.innerHTML = data[1].format.formatName;
          cell1.innerHTML = data[1].text;
        }
            
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
      integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
